name: calliopa

# The Calliopa stack. No image is published by Calliopa: the cell, the kernel,
# the agent service and the database are built on your machine from the
# recipes under build/ — base images you pull from their publishers, plus the
# Calliopa binaries downloaded from the release named in .env and checked
# against its pinned checksum — and the object store and the memory service
# are images you pull from their publishers. See THIRD-PARTY.md.

x-calliopa-build-args: &calliopa-build-args
  CALLIOPA_RELEASE_VERSION: ${CALLIOPA_RELEASE_VERSION:-}
  CALLIOPA_BINARY_SOURCE: ${CALLIOPA_BINARY_SOURCE:-https://github.com/frankzickert/calliopa/releases/download}
  CALLIOPA_RELEASE_SHA256SUMS: ${CALLIOPA_RELEASE_SHA256SUMS:-}

services:
  bootstrap:
    image: calliopa-cell:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    command: ["/usr/local/bin/bootstrap"]
    environment:
      CALLIOPA_SECRET_DIR: /run/secrets/calliopa
      # The core's principals (BO_0206): the owner — the one human whose
      # credential the CLI and the kernel present — the kernel's serve
      # principal, and the agent accounts. The bootstrap writes one token file
      # per name under credentials/, the app registers them at every boot.
      CALLIOPA_OWNER_PRINCIPAL: ${CALLIOPA_OWNER_PRINCIPAL:-owner}
      CALLIOPA_KERNEL_PRINCIPAL: ${CALLIOPA_KERNEL_PRINCIPAL:-human:operator}
      CALLIOPA_AGENT_PRINCIPALS: ${CALLIOPA_AGENT_PRINCIPALS:-claude,agent:hermes}
    volumes:
      - calliopa-secrets:/run/secrets/calliopa
    restart: "no"

  postgres:
    image: calliopa-postgres:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    build:
      context: build/postgres
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calliopa}
      POSTGRES_USER: ${POSTGRES_USER:-calliopa}
      POSTGRES_PASSWORD_FILE: /run/secrets/calliopa/postgres_password
    ports:
      - "${CALLIOPA_HOST_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - calliopa-secrets:/run/secrets/calliopa:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: calliopa-cell:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    command: ["/usr/local/bin/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calliopa}
      POSTGRES_USER: ${POSTGRES_USER:-calliopa}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      POSTGRES_PASSWORD_FILE: /run/secrets/calliopa/postgres_password
      # The memory service's database, created beside the graph's by this
      # one-shot. The shell keeps none since BO_0207_007.
      CALLIOPA_MEMORY_DB: ${CALLIOPA_MEMORY_DB:-honcho}
    volumes:
      - calliopa-secrets:/run/secrets/calliopa:ro
    restart: "no"

  app:
    image: calliopa-cell:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    build:
      context: build/cell
      args: *calliopa-build-args
    command: ["/usr/local/bin/app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    environment:
      APP_BIND_ADDR: 0.0.0.0:8080
      CALLIOPA_SECRET_DIR: /run/secrets/calliopa
      # The core's principals (BO_0206): the owner — the one human whose
      # credential the CLI and the kernel present — the kernel's serve
      # principal, and the agent accounts. The bootstrap writes one token file
      # per name under credentials/, the app registers them at every boot.
      CALLIOPA_OWNER_PRINCIPAL: ${CALLIOPA_OWNER_PRINCIPAL:-owner}
      CALLIOPA_KERNEL_PRINCIPAL: ${CALLIOPA_KERNEL_PRINCIPAL:-human:operator}
      CALLIOPA_AGENT_PRINCIPALS: ${CALLIOPA_AGENT_PRINCIPALS:-claude,agent:hermes}
      POSTGRES_DB: ${POSTGRES_DB:-calliopa}
      POSTGRES_USER: ${POSTGRES_USER:-calliopa}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      POSTGRES_PASSWORD_FILE: /run/secrets/calliopa/postgres_password
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_REGION: garage
      GARAGE_CONTENT_BUCKET: ${GARAGE_CONTENT_BUCKET:-calliopa-content}
      GARAGE_CONTENT_KEY_ID_FILE: /run/secrets/calliopa/garage_content_key_id
      GARAGE_CONTENT_KEY_SECRET_FILE: /run/secrets/calliopa/garage_content_key_secret
      BLOB_MAX_BYTES: ${BLOB_MAX_BYTES:-104857600}
      BLOB_STAGING_TTL_SECONDS: ${BLOB_STAGING_TTL_SECONDS:-604800}
      BLOB_GC_INTERVAL_SECONDS: ${BLOB_GC_INTERVAL_SECONDS:-86400}
    # No published port: browser and host traffic reach only the kernel, and
    # the kernel reaches CCGW on the compose network. The CLI runs in-stack
    # (docker compose exec kernel …). BO_0103_007
    volumes:
      - calliopa-secrets:/run/secrets/calliopa:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    image: ${CALLIOPA_GARAGE_IMAGE:-dxflrs/garage:v1.1.0@sha256:fdb8272fcbe643eef830ee17874d5d4ed623a86501f1acbac8012583113b1c26}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # The config is delivered by compose rather than baked into a derived
    # image, so the stack still depends on no host path and Calliopa
    # publishes no image. /etc/garage.toml is the binary's default path.
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    ports:
      - "${CALLIOPA_HOST_BIND:-127.0.0.1}:3900:3900"
    volumes:
      - garage-data:/var/lib/garage
      - calliopa-secrets:/run/secrets/calliopa:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage-init:
    image: calliopa-cell:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    command: ["/usr/local/bin/init-garage"]
    depends_on:
      garage:
        condition: service_healthy
    environment:
      CALLIOPA_SECRET_DIR: /run/secrets/calliopa
      GARAGE_BACKUP_BUCKET: ${GARAGE_BACKUP_BUCKET:-calliopa-backups}
      GARAGE_CONTENT_BUCKET: ${GARAGE_CONTENT_BUCKET:-calliopa-content}
      GARAGE_LAYOUT_CAPACITY: ${GARAGE_LAYOUT_CAPACITY:-10000000000}
    volumes:
      - calliopa-secrets:/run/secrets/calliopa
    restart: "no"

  backup:
    image: calliopa-cell:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    command: ["/usr/local/bin/backup", "run"]
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      CALLIOPA_SECRET_DIR: /run/secrets/calliopa
      POSTGRES_DB: ${POSTGRES_DB:-calliopa}
      POSTGRES_USER: ${POSTGRES_USER:-calliopa}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      GARAGE_BACKUP_BUCKET: ${GARAGE_BACKUP_BUCKET:-calliopa-backups}
      GARAGE_CONTENT_BUCKET: ${GARAGE_CONTENT_BUCKET:-calliopa-content}
      CALLIOPA_MEMORY_DB: ${CALLIOPA_MEMORY_DB:-honcho}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      OFFSITE_PATH: ${OFFSITE_PATH:-}
      OFFSITE_CONTENT_PATH: ${OFFSITE_CONTENT_PATH:-}
    volumes:
      - calliopa-secrets:/run/secrets/calliopa:ro

  # Hermes: the agent. The pinned upstream Hermes Agent with the Codex and
  # Claude sign-in broker, holding one Calliopa toolset: the kernel's, with
  # its statement, document and workspace tools, under the bearer the
  # bootstrap generates (BO_0207_006). It reaches the graph only through
  # that toolset, holds no database credentials,
  # publishes no host port, and keeps its state on a named volume. The
  # unconfigured state (API up, no agent signed in yet) is a defined healthy
  # state the settings view renders with the sign-in action.
  hermes:
    image: calliopa-hermes:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    build:
      context: build/hermes
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      HERMES_HOME: /var/lib/hermes
      CALLIOPA_HERMES_API_SECRET_FILE: /run/secrets/calliopa/hermes_api_key
      CALLIOPA_AGENT_TOOLS_BEARER_FILE: /run/secrets/calliopa/agent_tools_bearer
      CALLIOPA_KERNEL_TOOLS_URL: http://kernel:8090/__kernel/agent-tools
      CALLIOPA_AGENT_CONFIG_DIR: /var/lib/calliopa/agent-config
    volumes:
      - hermes-data:/var/lib/hermes
      - agent-config:/var/lib/calliopa/agent-config
      - calliopa-secrets:/run/secrets/calliopa:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8642/health',timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The UI kernel: bootloader and CLI. Prod serve materializes the promoted
  # release pin from the graph, builds it, and serves it behind the kernel
  # proxy on port 8090. The served tree is the shell, whose runtime
  # environment the kernel carries below and passes through. With no release pin set — a fresh install before any
  # release content — it idles cleanly serving its built-in fallback scaffold
  # and reports the no-pin state as healthy on /__kernel/healthz. The health
  # probe uses node because the slim kernel image carries no wget.
  kernel:
    image: calliopa-kernel:${CALLIOPA_RELEASE_VERSION:-local}
    pull_policy: never
    build:
      context: build/kernel
      args: *calliopa-build-args
    command: ["serve", "--mode", "prod", "--port", "8090", "--principal", "${CALLIOPA_KERNEL_PRINCIPAL:-human:operator}"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      CALLIOPA_CCGW_URL: http://app:8080
      # The credential files the kernel presents: the owner's for the CLI's
      # human commands and the bridge, its own for its serve principal, the
      # agent accounts' for the toolset per run. BO_0206_008
      CALLIOPA_SECRET_DIR: /run/secrets/calliopa
      CALLIOPA_KERNEL_DATA: /var/lib/calliopa-kernel
      # The confirmation origin binds wide inside the container; the host
      # publish below stays loopback, and browsers reach it at the published
      # address. BO_0103_003
      CALLIOPA_KERNEL_CONFIRM_BIND: 0.0.0.0
      CALLIOPA_KERNEL_CONFIRM_URL: ${CALLIOPA_KERNEL_CONFIRM_URL:-http://127.0.0.1:8091}
      # The agent bridge: the kernel half of the Hermes agent service.
      # BO_0089_012
      CALLIOPA_HERMES_URL: http://hermes:8642
      CALLIOPA_HERMES_BEARER_FILE: /run/secrets/calliopa/hermes_api_key
      CALLIOPA_AGENT_TOOLS_BEARER_FILE: /run/secrets/calliopa/agent_tools_bearer
      CALLIOPA_AGENT_CONFIG_DIR: /var/lib/calliopa/agent-config
      # The kernel hands the served tree the two addresses it needs, CCGW's
      # and its own, and nothing else: the shell keeps no database, bucket or
      # at-rest key of its own (BO_0207_007). The old shell's stores stay on
      # the volumes until the operator drops them after the transfer
      # (BO_0207_005, BO_0207_008); `kernel import-app-content` names them
      # through its flags.
      # The kernel's own at-rest key for the secret store it keeps for the
      # shell's party configuration. BO_0207_003
      CALLIOPA_KERNEL_SECRETS_KEY_PATH: /run/secrets/calliopa/kernel_secrets_key
      # The release the images were built from, the variable their tags use,
      # so `kernel diagnose` states which release a support file describes.
      # BO_0205_003
      CALLIOPA_RELEASE_VERSION: ${CALLIOPA_RELEASE_VERSION:-}
    ports:
      - "${CALLIOPA_HOST_BIND:-127.0.0.1}:8090:8090"
      - "${CALLIOPA_HOST_BIND:-127.0.0.1}:8091:8091"
    volumes:
      - kernel-data:/var/lib/calliopa-kernel
      - agent-config:/var/lib/calliopa/agent-config
      - calliopa-secrets:/run/secrets/calliopa:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/__kernel/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The agent's memory. Honcho refuses to start without an LLM key, and the
  # key lives in the shell's connection store rather than in .env, so both
  # services sit under a profile: scripts/memory-up.sh reads the stored key
  # through the shell and turns the profile on with it. An instance with no
  # stored key simply has no memory service. Each container starts as root
  # only to read the database password file, then drops to the image's own
  # user.
  honcho:
    image: ${CALLIOPA_HONCHO_IMAGE:-ghcr.io/plastic-labs/honcho:v3.1.0}
    profiles: ["memory"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: "0"
    command:
      - sh
      - -c
      - >-
        export DB_CONNECTION_URI="postgresql+psycopg://${POSTGRES_USER:-calliopa}:$$(cat /run/secrets/calliopa/postgres_password)@postgres:5432/${CALLIOPA_MEMORY_DB:-honcho}"
        && exec setpriv --reuid=app --regid=app --init-groups
        sh -c '/app/.venv/bin/alembic upgrade head && exec fastapi run --host 0.0.0.0 src/main.py'
    environment:
      VECTOR_STORE_TYPE: pgvector
      AUTH_USE_AUTH: "false"
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
    volumes:
      - calliopa-secrets:/run/secrets/calliopa:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  honcho-deriver:
    image: ${CALLIOPA_HONCHO_IMAGE:-ghcr.io/plastic-labs/honcho:v3.1.0}
    profiles: ["memory"]
    depends_on:
      honcho:
        condition: service_healthy
    user: "0"
    entrypoint:
      - sh
      - -c
      - >-
        export DB_CONNECTION_URI="postgresql+psycopg://${POSTGRES_USER:-calliopa}:$$(cat /run/secrets/calliopa/postgres_password)@postgres:5432/${CALLIOPA_MEMORY_DB:-honcho}"
        && exec setpriv --reuid=app --regid=app --init-groups
        /app/.venv/bin/python -m src.deriver
    environment:
      VECTOR_STORE_TYPE: pgvector
      AUTH_USE_AUTH: "false"
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
    volumes:
      - calliopa-secrets:/run/secrets/calliopa:ro

configs:
  # Single-node Garage. Secrets come from the bootstrap one-shot via the
  # shared secrets volume.
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "garage:3901"
      rpc_secret_file = "/run/secrets/calliopa/garage_rpc_secret"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token_file = "/run/secrets/calliopa/garage_admin_token"

volumes:
  calliopa-secrets:
  postgres-data:
  garage-data:
  kernel-data:
  hermes-data:
  agent-config:
